<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="0.6" stop-color="#151c38"/>
      <stop offset="1" stop-color="#0c1022"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#f0be5a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f0be5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#78d2be"/>
      <stop offset="0.5" stop-color="#9fd8f0"/>
      <stop offset="1" stop-color="#78d2be"/>
    </linearGradient>
  </defs>

  <!-- Night sky tile -->
  <rect width="256" height="256" rx="52" fill="url(#sky)"/>
  <rect x="6" y="6" width="244" height="244" rx="47" fill="none" stroke="#3a4a80" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Faint background stars -->
  <g fill="#cfe0ff">
    <circle cx="42" cy="52" r="1.8" opacity="0.7"/>
    <circle cx="86" cy="34" r="1.2" opacity="0.5"/>
    <circle cx="206" cy="46" r="1.6" opacity="0.65"/>
    <circle cx="222" cy="98" r="1.1" opacity="0.45"/>
    <circle cx="36" cy="118" r="1.2" opacity="0.5"/>
    <circle cx="168" cy="214" r="1.5" opacity="0.55"/>
    <circle cx="214" cy="200" r="1.1" opacity="0.4"/>
    <circle cx="58" cy="214" r="1.3" opacity="0.45"/>
    <circle cx="150" cy="30" r="1" opacity="0.4"/>
  </g>

  <!-- The flow: a constellation line through three nodes -->
  <path d="M60 178 L128 104 L198 150" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- End nodes -->
  <circle cx="60" cy="178" r="17" fill="#5ac8b4"/>
  <circle cx="60" cy="178" r="7" fill="#0f1530"/>
  <circle cx="198" cy="150" r="17" fill="#5ac8b4"/>
  <circle cx="198" cy="150" r="7" fill="#0f1530"/>

  <!-- The star at the center of the flow -->
  <circle cx="128" cy="104" r="52" fill="url(#glow)"/>
  <path d="M128 58 C132 90 142 100 174 104 C142 108 132 118 128 150 C124 118 114 108 82 104 C114 100 124 90 128 58 Z" fill="#f6cf6e"/>
  <path d="M128 78 C130 96 136 102 154 104 C136 106 130 112 128 130 C126 112 120 106 102 104 C120 102 126 96 128 78 Z" fill="#fff4d2"/>
</svg>

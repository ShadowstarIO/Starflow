name: Build Flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$cs = Get-Content Flow/Flow.csproj
          $v = $cs.Project.PropertyGroup.Version | Select-Object -First 1
          if (-not $v) { throw "Version missing from Flow.csproj" }
          $unix = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "v$v" }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "unix=$unix" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v  Tag $tag  LastUpdate $unix"

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip $dest

      - name: Build
        run: dotnet build Flow.slnx --configuration Release -p:RestoreLockedMode=false

      - name: Test
        run: dotnet test Flow.Tests/Flow.Tests.csproj --configuration Release --no-build

      - name: Stage package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter Flow.dll |
            Where-Object { $_.FullName -match "\\bin\\" } |
            Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Recurse Flow | Select-Object FullName
            throw "Flow.dll missing"
          }
          $out = "artifacts/Flow"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$($dll.DirectoryName)\*" $out -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$out\images" | Out-Null
          foreach ($candidate in @(
            "images\icon.png",
            "$($dll.DirectoryName)\images\icon.png",
            "$($dll.DirectoryName)\icon.png"
          )) {
            if (Test-Path $candidate) {
              Copy-Item $candidate "$out\images\icon.png" -Force
              Copy-Item $candidate "$out\icon.png" -Force
              break
            }
          }
          if (Test-Path "images\icon.svg") {
            Copy-Item "images\icon.svg" "$out\images\icon.svg" -Force
          }
          if (-not (Test-Path "$out\Flow.dll")) { throw "Copy failed" }
          Compress-Archive -Path "$out\*" -DestinationPath artifacts/Flow.zip -Force
          Write-Host "Packaged $($dll.FullName) as artifacts/Flow.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Flow
          path: |
            artifacts/Flow/**
            artifacts/Flow.zip
          if-no-files-found: error

      - name: Publish testing prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Flow ${{ steps.ver.outputs.version }} testing
          body: |
            Testing build.

            Open `/flow` or `/fl` after install.
          prerelease: true
          files: artifacts/Flow.zip

      - name: Sync plugin repo (testing always; live only on full releases)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $unix = [int64]"${{ steps.ver.outputs.unix }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          $isPre = "${{ github.event.release.prerelease }}" -eq "true"
          $link = "https://github.com/ShadowstarIO/Flow/releases/download/$tag/Flow.zip"
          foreach ($path in @("pluginmaster.json", "repo.json")) {
            $raw = Get-Content $path -Raw | ConvertFrom-Json
            $entry = if ($raw -is [System.Array]) { $raw[0] } else { $raw }
            if ($entry.PSObject.Properties.Name -notcontains "TestingAssemblyVersion") {
              $entry | Add-Member -NotePropertyName TestingAssemblyVersion -NotePropertyValue $v
            } else {
              $entry.TestingAssemblyVersion = $v
            }
            $entry.DownloadLinkTesting = $link
            if (-not $isPre) {
              $entry.AssemblyVersion = $v
              $entry.DownloadLinkInstall = $link
              $entry.DownloadLinkUpdate = $link
            }
            if ($entry.PSObject.Properties.Name -contains "LastUpdate") {
              $entry.LastUpdate = $unix
            }
            $json = ConvertTo-Json -InputObject @($entry) -Depth 8
            if (-not $json.TrimStart().StartsWith('[')) {
              $json = "[`n" + $json + "`n]"
            }
            [IO.File]::WriteAllText((Resolve-Path $path), $json.TrimEnd() + "`n")
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $kind = if ($isPre) { "testing" } else { "release" }
            git commit -m "${kind}: $v manifests [skip ci]"
            git push origin HEAD:main
          }

      - name: Attach Flow.zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Flow.zip
